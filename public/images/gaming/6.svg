<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#2e1e42"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD600"/>
      <stop offset="100%" style="stop-color:#FF6D00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD600;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFD600;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFD600" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="300" fill="#FFD600" opacity="0.05"/>
  <circle cx="1080" cy="570" r="250" fill="#FF6D00" opacity="0.07"/>
  <circle cx="640" cy="360" r="400" fill="url(#glow)"/>
  <!-- Geometric accents -->
  <rect x="80" y="600" width="1120" height="4" rx="2" fill="url(#textGrad)" opacity="0.3"/>
  <rect x="80" y="116" width="1120" height="4" rx="2" fill="url(#textGrad)" opacity="0.3"/>
  <!-- Corner accents -->
  <polygon points="0,0 120,0 0,120" fill="#FFD600" opacity="0.15"/>
  <polygon points="1280,720 1160,720 1280,600" fill="#FF6D00" opacity="0.15"/>
  <!-- Title text -->
  <g filter="url(#shadow)">
    <text x="640" y="260" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="900" fill="url(#textGrad)" stroke="#FFD60033" stroke-width="3" letter-spacing="4">SECRET</text>
    <text x="640" y="340" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="72" font-weight="900" fill="url(#textGrad)" stroke="#FFD60033" stroke-width="3" letter-spacing="4">EASTER EGGS</text>
  </g>
</svg>